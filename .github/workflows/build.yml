name: Build

on:
    push:
        branches: [main]
    pull_request:
        # All branches

    workflow_dispatch:

env:
    DOTNET_VERSION: "10.0.x"
    NODE_VERSION: "24"
    OTP_VERSION: "28"
    GLEAM_VERSION: "1.19.2"

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup .NET Core
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Setup Gleam
              uses: erlef/setup-beam@v1
              with:
                  otp-version: ${{ env.OTP_VERSION }}
                  gleam-version: ${{ env.GLEAM_VERSION }}

            - name: Restore dependencies
              run: dotnet restore
              working-directory: ./service

            - name: Testing
              run: dotnet test --filter TestCategory!=DatabaseDependency
              working-directory: ./service

            - name: Building
              run: dotnet build --no-restore --configuration Release -consoleloggerparameters:NoSummary
              working-directory: ./service

            - name: Install frontend dependencies
              run: npm ci
              working-directory: ./webapp

            - name: Gleam test
              # Tests the shared, app and admin projects.
              run: make test
              working-directory: ./webapp

            - name: Build frontend
              # Builds the app and admin projects and bundles them to dist/ui and dist/admin.
              run: make build
              working-directory: ./webapp
