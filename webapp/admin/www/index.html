<!doctype html>
<html lang="">

        <title>Quarter Admin</title>

        <link

        <body>
        <div class="application" id="admin"></div>
        <footer>
            <div class="logo">
                <svg>
                    <use xlink:href="#quarter-logo"></use>
                </svg>

            <nav>

            </p>
        </footer>

        <script type="module" src="./admin.js"></script>

        <!-- All icons used in quarter comes from heroicons.com -->
        <svg
            aria-hidden="true"
            style="position: absolute; width: 0; height: 0; overflow: hidden"
            xmlns="http://www.w3.org/2000/svg"
        >
            <symbol
                id="quarter-logo"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <circle cx="12" cy="12" r="10" />
                <path
                    d="M12 12V2.5A9.5 9.5 0 0 1 21.5 12H12z"
                    fill="currentColor"
                    stroke="none"
                />
                <line x1="12" y1="12" x2="12" y2="2" />
                <line x1="12" y1="12" x2="22" y2="12" />
            </symbol>

            <symbol
                id="bars-3"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                />
            </symbol>

            <symbol
                id="x-mark"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M6 18 18 6M6 6l12 12"
                />
            </symbol>

            <symbol
                id="user-plus"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"

                />
            </symbol>

            <symbol
                id="arrow-left-end-on-rectangle"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75"
